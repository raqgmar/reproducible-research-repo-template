name: Pruebas y experimento de ejemplo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
      - name: Ejecutar pruebas
        run: python -B -m unittest discover -s tests -v
      - name: Regenerar dos veces y comparar
        run: |
          primera=$(python -m src.run experiments/ejemplo.json)
          segunda=$(python -m src.run experiments/ejemplo.json)
          diff "$primera/metricas.json" "$segunda/metricas.json"
          diff "$primera/manuscrito.md" "$segunda/manuscrito.md"
          test "$primera" != "$segunda"
